services:

  postgres:
    image: postgres:17
    container_name: sweet_marketplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sweet_marketplace
      POSTGRES_USER: sweet_marketplace
      POSTGRES_PASSWORD: sweet_marketplace_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sweet_marketplace -d sweet_marketplace"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sweet_marketplace_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
